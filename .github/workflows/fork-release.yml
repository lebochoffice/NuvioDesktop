name: Fork - Windows MSI candidate

on:
  push:
    branches: [Dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-windows-candidate
  cancel-in-progress: true

jobs:
  candidate:
    if: github.repository == 'lebochoffice/NuvioDesktop' && github.ref == 'refs/heads/Dev' && vars.FORK_WINDOWS_CANDIDATES == 'true'
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      NUVIO_SUPABASE_URL: ${{ vars.NUVIO_SUPABASE_URL }}
      NUVIO_SUPABASE_ANON_KEY: ${{ vars.NUVIO_SUPABASE_ANON_KEY }}
      NUVIO_INTRODB_API_URL: ${{ vars.NUVIO_INTRODB_API_URL }}
      WEBVIEW2_VERSION: 1.0.4078.44
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Allocate unsigned candidate version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_FLOOR: ${{ vars.FORK_WINDOWS_VERSION_FLOOR || '0.1.72' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'Unexpected checkout commit.' }
          if ($env:VERSION_FLOOR -cnotmatch '^0\.1\.(0|[1-9][0-9]{0,4})\z') {
            throw 'FORK_WINDOWS_VERSION_FLOOR must be an already reserved 0.1.x version.'
          }
          $next = [int]$Matches[1] + 1
          $tags = @(git tag --list 'v*-watchparty')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enumerate tags.' }
          $releases = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enumerate releases.' }
          foreach ($tag in @($tags + $releases | Sort-Object -Unique)) {
            if ($tag -cnotmatch '^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,4})-watchparty\z') { continue }
            $app = [version]::new([int]$Matches[1], [int]$Matches[2], [int]$Matches[3])
            $msi = [version]::new([Math]::Max(1, $app.Major), $app.Minor, $app.Build)
            if ($app -ge [version]'0.2.0' -or $msi -ge [version]'1.2.0') {
              throw "Existing release $tag is outside the automatic 0.1.x / 1.1.x version series."
            }
            if ($msi.Minor -eq 1) { $next = [Math]::Max($next, $msi.Build + 1) }
          }
          if ($next -gt 65535) { throw 'Windows Installer build number exhausted.' }
          "NUVIO_FORK_VERSION=0.1.$next-watchparty" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "EXPECTED_MSI_VERSION=1.1.$next" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Fork invariants
        shell: bash
        run: bash fork-maintenance/check-fork-invariants.sh
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-site/package-lock.json
      - name: Browser tests
        shell: pwsh
        working-directory: browser-site
        run: |
          npm ci --ignore-scripts; if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm test; if ($LASTEXITCODE -ne 0) { throw 'Browser tests failed' }
      - name: Fetch official Windows runtime without user credentials
        shell: pwsh
        run: |
          git lfs fetch https://github.com/NuvioMedia/NuvioDesktop.git HEAD --include='composeApp/src/desktopMain/native/windows/runtime/**' --exclude=''
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime LFS download failed' }
          git lfs checkout 'composeApp/src/desktopMain/native/windows/runtime/*'
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime LFS checkout failed' }
          if ((Get-Item 'composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll').Length -lt 1000000) { throw 'libmpv is still an LFS pointer' }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install WebView2 build SDK locally
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP "Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          nuget install Microsoft.Web.WebView2 -Version $env:WEBVIEW2_VERSION -OutputDirectory $env:RUNNER_TEMP -DirectDownload -NonInteractive -NoCache
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 SDK download failed' }
          if (-not (Test-Path -LiteralPath (Join-Path $sdk 'build/native/x64/WebView2Loader.dll'))) { throw 'WebView2 x64 runtime loader missing' }
          "NUVIO_WEBVIEW2_DIR=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Desktop tests (party, updater, fork logic)
        shell: pwsh
        run: |
          .\fork-maintenance\tests\windows-msi-identity.test.ps1
          .\gradlew.bat :composeApp:desktopTest --tests '*Party*Test' --tests '*Fork*UpdateTest' --tests '*AppUpdate*Test' --tests '*UpdateChannelTest' --tests '*ReleaseSelector*' --tests '*VersionUtils*' --tests '*DesktopStorageTest' "-Pnuvio.webview2.dir=$env:NUVIO_WEBVIEW2_DIR" '-Dorg.gradle.jvmargs=-Xmx4g' '-Pkotlin.daemon.jvmargs=-Xmx3g' --max-workers=2 --no-configuration-cache --console=plain --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed; no release.' }
      - name: Build and verify MSI (same commit)
        shell: pwsh
        run: ./fork-maintenance/build-ci.ps1
      - name: Check and stage unsigned candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $remote = @(git ls-remote origin refs/heads/Dev)
          if ($LASTEXITCODE -ne 0 -or $remote.Count -ne 1 -or ($remote[0] -split '\s+')[0] -cne $env:GITHUB_SHA) {
            throw 'Dev moved or is unavailable. This candidate is stale.'
          }
          $version = $env:NUVIO_FORK_VERSION
          $source = Get-Item "composeApp/build/compose/release-msis/Nuvio-Windows-x64-$version.msi"
          $manifestPath = Join-Path $source.DirectoryName ($source.BaseName + '-verification.json')
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $hash = (Get-FileHash -LiteralPath $source.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.sha256 -cne $hash -or $manifest.sourceCommit -cne $env:GITHUB_SHA -or
              $manifest.bytes -ne $source.Length -or $manifest.productVersion -cne $env:EXPECTED_MSI_VERSION -or
              $manifest.browserInviteOrigin -cne 'https://nuvio-watch-friends.pages.dev' -or
              $manifest.familyPartyRegistryInspected -ne $true -or $manifest.architecture -cne 'x64' -or
              $manifest.signature -cne 'NotSigned') {
            throw 'Unsigned candidate does not match verified Dev MSI metadata.'
          }
          $out = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/windows-candidate"
          Copy-Item -LiteralPath $source.FullName -Destination (Join-Path $out "Nuvio-WatchParty-Windows-x64-$version.msi")
          Copy-Item -LiteralPath $manifestPath -Destination (Join-Path $out 'verification.json')
          "Unsigned candidate $version from $env:GITHUB_SHA. SHA-256: $hash. No release was published." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-windows-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/windows-candidate
          if-no-files-found: error
          retention-days: 7
