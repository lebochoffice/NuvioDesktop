name: Fork - Release Windows MSI

# Manual only: there is no schedule or push trigger. The job runs in the
# "fork-release" environment; configure required reviewers there so every
# release needs an explicit approval. Builds, verifies and publishes one
# GitHub release whose MSI, checksum and notes all come from the same Dev commit.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Fork version, e.g. 0.1.38-watchparty (numeric core must exceed the last release)'
        required: true
      notes:
        description: 'Short release notes (optional)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'lebochoffice/NuvioDesktop' && github.ref == 'refs/heads/Dev'
    runs-on: windows-2022
    timeout-minutes: 75
    environment: fork-release
    permissions:
      contents: write
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      GH_TOKEN: ${{ github.token }}
      NUVIO_SUPABASE_URL: ${{ vars.NUVIO_SUPABASE_URL }}
      NUVIO_SUPABASE_ANON_KEY: ${{ vars.NUVIO_SUPABASE_ANON_KEY }}
      NUVIO_INTRODB_API_URL: ${{ vars.NUVIO_INTRODB_API_URL }}
      NUVIO_FORK_VERSION: ${{ inputs.version }}
      WEBVIEW2_VERSION: 1.0.4078.44
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate version, tag and monotonic numbering
        shell: pwsh
        run: |
          $version = $env:NUVIO_FORK_VERSION
          if ($version -cnotmatch '^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,4})-watchparty\z') {
            throw 'Version must look like 0.1.38-watchparty.'
          }
          $tag = "v$version"
          if (git tag --list $tag) { throw "Tag $tag already exists." }
          $core = [version]($version.Split('-')[0])
          if ($core.Major -gt 255 -or $core.Minor -gt 255 -or $core.Build -gt 65535) { throw 'Version exceeds Windows Installer limits.' }
          $msiVersion = [version]::new([Math]::Max(1, $core.Major), $core.Minor, $core.Build)
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot confirm existing release versions.' }
          foreach ($r in $releases) {
            if ($r.tagName -notmatch '^v(\d+\.\d+\.\d+)-watchparty$') { continue }
            $previous = [version]$Matches[1]
            $previousMsi = [version]::new([Math]::Max(1, $previous.Major), $previous.Minor, $previous.Build)
            if ($previous -ge $core -or $previousMsi -ge $msiVersion) { throw "App and MSI versions must exceed existing release $($r.tagName)." }
          }
          "FORK_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FORK_SHA=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Fork invariants
        shell: bash
        run: bash fork-maintenance/check-fork-invariants.sh
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-site/package-lock.json
      - name: Browser tests
        shell: pwsh
        working-directory: browser-site
        run: |
          npm ci --ignore-scripts; if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm test; if ($LASTEXITCODE -ne 0) { throw 'Browser tests failed' }
      - name: Fetch official Windows runtime without user credentials
        shell: pwsh
        run: |
          git lfs fetch https://github.com/NuvioMedia/NuvioDesktop.git HEAD --include='composeApp/src/desktopMain/native/windows/runtime/**' --exclude=''
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime LFS download failed' }
          git lfs checkout 'composeApp/src/desktopMain/native/windows/runtime/*'
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime LFS checkout failed' }
          if ((Get-Item 'composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll').Length -lt 1000000) { throw 'libmpv is still an LFS pointer' }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install WebView2 build SDK locally
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP "Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          nuget install Microsoft.Web.WebView2 -Version $env:WEBVIEW2_VERSION -OutputDirectory $env:RUNNER_TEMP -DirectDownload -NonInteractive -NoCache
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 SDK download failed' }
          if (-not (Test-Path -LiteralPath (Join-Path $sdk 'build/native/x64/WebView2Loader.dll'))) { throw 'WebView2 x64 runtime loader missing' }
          "NUVIO_WEBVIEW2_DIR=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Desktop tests (party, updater, fork logic)
        shell: pwsh
        run: |
          .\fork-maintenance\tests\windows-msi-identity.test.ps1
          .\gradlew.bat :composeApp:desktopTest --tests '*Party*Test' --tests '*Fork*UpdateTest' --tests '*AppUpdate*Test' --tests '*UpdateChannelTest' --tests '*ReleaseSelector*' --tests '*VersionUtils*' --tests '*DesktopStorageTest' "-Pnuvio.webview2.dir=$env:NUVIO_WEBVIEW2_DIR" '-Dorg.gradle.jvmargs=-Xmx4g' '-Pkotlin.daemon.jvmargs=-Xmx3g' --max-workers=2 --no-configuration-cache --console=plain --stacktrace
          if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed; no release.' }
      - name: Build and verify MSI (same commit)
        shell: pwsh
        run: ./fork-maintenance/build-ci.ps1
      - name: Sign MSI and verify signed bytes
        shell: pwsh
        env:
          NUVIO_SIGN_TIMESTAMP_URL: ${{ vars.NUVIO_SIGN_TIMESTAMP_URL }}
        run: |
          $msi = Get-Item "composeApp/build/compose/release-msis/Nuvio-Windows-x64-$env:NUVIO_FORK_VERSION.msi"
          $manifestPath = Join-Path $msi.DirectoryName ($msi.BaseName + '-verification.json')
          $unsigned = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          .\fork-maintenance\sign-family-release.ps1 -MsiPath $msi.FullName -TimestampUrl $env:NUVIO_SIGN_TIMESTAMP_URL
          .\fork-maintenance\verify-msi.ps1 -MsiPath $msi.FullName -ExpectedProductVersion $unsigned.productVersion
      - name: Prepare release assets
        shell: pwsh
        run: |
          $source = Get-Item "composeApp/build/compose/release-msis/Nuvio-Windows-x64-$env:NUVIO_FORK_VERSION.msi"
          $manifestPath = Join-Path $source.DirectoryName ($source.BaseName + '-verification.json')
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $out = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/release"
          $asset = Join-Path $out "Nuvio-WatchParty-Windows-x64-$env:NUVIO_FORK_VERSION.msi"
          Copy-Item -LiteralPath $source.FullName -Destination $asset
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.sha256 -cne $hash -or $manifest.sourceCommit -cne $env:FORK_SHA -or
              $manifest.browserInviteOrigin -cne 'https://nuvio-watch-friends.pages.dev' -or
              $manifest.familyPartyRegistryInspected -ne $true -or $manifest.architecture -cne 'x64' -or
              $manifest.signature -cne 'Valid') {
            throw 'Release artifact differs from the verified production-origin x64 MSI.'
          }
          "$hash  $(Split-Path -Leaf $asset)" | Set-Content -LiteralPath "$asset.sha256" -Encoding ascii
          Copy-Item -LiteralPath $manifestPath -Destination (Join-Path $out "Nuvio-WatchParty-Windows-x64-$env:NUVIO_FORK_VERSION-verification.json")
          $notes = @(
            "Nuvio Desktop (Watch Party fork) $env:NUVIO_FORK_VERSION",
            '',
            $env:RELEASE_NOTES,
            '',
            "Source commit: https://github.com/$env:GITHUB_REPOSITORY/commit/$env:FORK_SHA",
            "SHA-256 ($(Split-Path -Leaf $asset)): $hash",
            'Signed Nuvio Family MSI. In-app installation remains disabled pending isolated Windows acceptance.'
          ) -join "`n"
          Set-Content -LiteralPath (Join-Path $out 'notes.md') -Value $notes -Encoding utf8
          "RELEASE_DIR=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
      - name: Publish GitHub release (tag on the verified commit)
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath $env:RELEASE_DIR -File | Where-Object { $_.Name -ne 'notes.md' } | ForEach-Object { $_.FullName }
          gh release create $env:FORK_TAG @files --repo $env:GITHUB_REPOSITORY --target $env:FORK_SHA --title "Nuvio Watch Party $env:NUVIO_FORK_VERSION" --notes-file (Join-Path $env:RELEASE_DIR 'notes.md')
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
