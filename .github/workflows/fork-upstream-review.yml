name: Fork - Review upstream updates

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      retry_pr:
        description: 'Optional closed upstream PR number to retry the exact release'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: fork-upstream-review
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'lebochoffice/NuvioDesktop' && github.event.repository.default_branch == 'Dev' && github.ref == 'refs/heads/Dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      # GitHub requires approval before running PR workflows created with this token.
      GH_TOKEN: ${{ github.token }}
      NUVIO_RETRY_PR: ${{ inputs.retry_pr }}
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: Dev
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Prepare a published upstream release for review
        shell: bash
        run: bash fork-maintenance/upstream-pr.sh
